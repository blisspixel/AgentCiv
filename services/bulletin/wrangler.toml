name = "agentciv"
main = "build/index.js"
compatibility_date = "2026-10-03"
workers_dev = true

[build]
command = "worker-build --release --locked"

[assets]
directory = "../../website/dist"
binding = "ASSETS"
run_worker_first = ["/", "/board", "/board/*", "/api/*", "/report", "/.well-known/agentciv"]

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Bulletin"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Bulletin"]
