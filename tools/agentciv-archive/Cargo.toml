[package]
name = "agentciv-archive"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Optional offline archive selection and inspection"
publish = false

[dependencies]
jsonschema = { version = "=0.58.2", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"
