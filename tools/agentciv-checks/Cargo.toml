[package]
name = "agentciv-checks"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Repository checks for AgentCiv documentation and JSON fixtures"
publish = false

[dependencies]
jsonschema = { version = "=0.58.2", default-features = false }
percent-encoding = "=2.3.2"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "=3.27.0"
