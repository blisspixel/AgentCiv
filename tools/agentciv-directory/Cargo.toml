[package]
name = "agentciv-directory"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Optional static world directory builder for agentciv.io"
publish = false

[dependencies]
jsonschema = { version = "=0.58.2", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"
