[package]
name = "agentciv-reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Optional bounded read-only HTTP Commons history collector"
publish = false

[dependencies]
agentciv-archive = { path = "../agentciv-archive" }
jsonschema = { version = "=0.58.2", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }

[dev-dependencies]
tempfile = "=3.27.0"
