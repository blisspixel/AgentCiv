[package]
name = "agentciv-conformance"
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Black-box HTTP Commons conformance runner"
publish = false

[dependencies]
jsonschema = { version = "=0.58.2", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = "=0.10.9"
