# Type check for the maintained Python. This file does not make a
# Python package. The host process imports only the standard library.

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "implementations/http-commons-python",
    "examples/http-commons",
    "examples/participants",
]

[tool.coverage.run]
source = ["implementations/http-commons-python", "examples/http-commons", "examples/participants"]
omit = ["*/test_*.py"]
patch = ["subprocess"]
sigterm = true
relative_files = true

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
