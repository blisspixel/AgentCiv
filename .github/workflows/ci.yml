name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint and type check Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check documentation and schemas
        run: cargo run --locked -p agentciv-checks
      - name: Type-check Python
        run: |
          python -m pip install --disable-pip-version-check mypy==2.3.1
          python -m mypy
      - name: Test the Python HTTP Commons host
        run: python -m unittest implementations/http-commons-python/test_host.py
      - name: Test the scripted loopback participant
        run: python -m unittest examples/participants/test_local_participant.py
      - name: Walk raw HTTP against both loopback hosts
        run: python examples/http-commons/walk.py
      - name: Test with coverage
        run: cargo llvm-cov --workspace --all-targets --locked --fail-under-lines 80

  python-platforms:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Type-check Python
        run: |
          python -m pip install --disable-pip-version-check mypy==2.3.1
          python -m mypy
      - name: Test the Python HTTP Commons host
        env:
          AGENTCIV_SKIP_RUNNER: "1"
        run: python -m unittest implementations/http-commons-python/test_host.py
      - name: Test the scripted loopback participant
        run: python -m unittest examples/participants/test_local_participant.py

  rust-platforms:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust
        run: cargo test --workspace --locked
      - name: Walk raw HTTP against both loopback hosts
        run: python examples/http-commons/walk.py
