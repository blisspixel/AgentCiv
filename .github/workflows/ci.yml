name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.8.7
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint and type check
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check documentation and schemas
        run: cargo run --locked -p agentciv-checks
      - name: Test the Python HTTP Commons host
        run: python3 -m unittest implementations/http-commons-python/test_host.py
      - name: Walk raw HTTP against both loopback hosts
        run: python3 examples/http-commons/walk.py
      - name: Test with coverage
        run: cargo llvm-cov --workspace --all-targets --locked --fail-under-lines 80
