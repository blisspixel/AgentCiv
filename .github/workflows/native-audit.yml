name: Native distribution audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Native notices and linkage (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ''
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: .exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and exercise the exact native source
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          set -euo pipefail
          mkdir -p dist/audit
          git rev-parse HEAD > dist/audit/SOURCE_COMMIT
          rustc -vV > dist/audit/rustc.txt
          cargo -vV > dist/audit/cargo.txt
          cp Cargo.lock rust-toolchain.toml dist/audit/
          cargo test --locked --target "$TARGET" -p agentciv-archive -p agentciv-reader
          cargo build --release --locked --target "$TARGET" -p agentciv-archive -p agentciv-reader -p agentciv-host -p agentciv-conformance
          cargo metadata --locked --format-version 1 --filter-platform "$TARGET" > dist/audit/metadata.json
          audit_version=$(jq -er '[.packages[] | select(.name == "agentciv-archive" or .name == "agentciv-reader" or .name == "agentciv-host" or .name == "agentciv-conformance") | .version] | select(length == 4) | unique | select(length == 1) | .[0]' dist/audit/metadata.json)
          [[ "$audit_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'AUDIT_VERSION=v%s\n' "$audit_version" >> "$GITHUB_ENV"
          printf 'v%s\n' "$audit_version" > dist/audit/VERSION
          for tool in agentciv-archive agentciv-reader agentciv-host agentciv-conformance; do
            binary="target/$TARGET/release/$tool$SUFFIX"
            test "$("$binary" --version)" = "$tool $audit_version"
            "$binary" --help > "dist/audit/$tool-help.txt"
            cp "$binary" "dist/$tool-v$audit_version-$TARGET$SUFFIX"
          done
          "target/$TARGET/release/agentciv-archive$SUFFIX" demo > dist/audit/demo.json
          grep -q 'source_authenticity' dist/audit/demo.json
          (
            cd dist
            # Windows GNU emits a binary marker. Preserve binary hashing and
            # write the installer's canonical two-space filename separator.
            for audit_asset in agentciv-*; do
              if command -v sha256sum >/dev/null 2>&1; then
                audit_hash=$(sha256sum --binary "$audit_asset")
              else
                audit_hash=$(shasum -a 256 -b "$audit_asset")
              fi
              printf '%s  %s\n' "${audit_hash%% *}" "$audit_asset"
            done > "SHA256SUMS-$TARGET"
          )
      - name: Preserve original native toolchain notices
        shell: bash
        run: |
          set -euo pipefail
          audit_sysroot=$(rustc --print sysroot | tr -d '\r')
          if command -v cygpath >/dev/null 2>&1; then
            audit_sysroot=$(cygpath -u "$audit_sysroot")
          fi
          (
            cd "$audit_sysroot"
            find share/doc -type f \( -iname 'license*' -o -iname 'licence*' -o -iname 'copying*' -o -iname 'notice*' -o -iname 'copyright*' -o -iname 'authors*' -o -iname 'unlicense*' -o -path '*/licenses/*' -o -path '*/licences/*' \) -print0
          ) > dist/audit/toolchain-notice-paths.nul
          test -s dist/audit/toolchain-notice-paths.nul
          tar -czf "$PWD/dist/audit/toolchain-notices.tar.gz" -C "$audit_sysroot" --null -T "$PWD/dist/audit/toolchain-notice-paths.nul"
      - name: Inspect GNU linkage and symbol versions
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for tool in agentciv-archive agentciv-reader agentciv-host agentciv-conformance; do
            binary="target/$TARGET/release/$tool"
            readelf --dynamic "$binary" > "dist/audit/$tool-dynamic.txt"
            readelf --version-info "$binary" > "dist/audit/$tool-symbol-versions.txt"
            ldd "$binary" > "dist/audit/$tool-runtime.txt"
          done
      - name: Inspect macOS linkage and deployment versions
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for tool in agentciv-archive agentciv-reader agentciv-host agentciv-conformance; do
            binary="target/$TARGET/release/$tool"
            otool -L "$binary" > "dist/audit/$tool-runtime.txt"
            vtool -show-build "$binary" > "dist/audit/$tool-build-version.txt"
          done
      - name: Inspect Windows imports and reject dynamic MSVC runtime dependencies
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $auditSysroot = & rustc --print sysroot
          if ($LASTEXITCODE -ne 0) { throw 'toolchain unavailable' }
          $auditHost = ((& rustc -vV | Where-Object { $_ -like 'host: *' }) -replace '^host: ', '').Trim()
          if ($LASTEXITCODE -ne 0 -or -not $auditHost) { throw 'native toolchain host unavailable' }
          $auditInspector = Join-Path $auditSysroot "lib/rustlib/$auditHost/bin/llvm-readobj.exe"
          if (-not (Test-Path -LiteralPath $auditInspector)) { throw 'pinned import inspector unavailable' }
          foreach ($tool in 'agentciv-archive','agentciv-reader','agentciv-host','agentciv-conformance') {
            $auditImports = & $auditInspector --coff-imports "target/$env:TARGET/release/$tool.exe"
            if ($LASTEXITCODE -ne 0 -or ($auditImports -join "`n") -match '(?i)\b(?:vcruntime|msvcp)[a-z0-9_]*\.dll\b') {
              throw 'binary requires a separately installed MSVC runtime'
            }
            $auditImports | Set-Content -LiteralPath "dist/audit/$tool-runtime.txt" -Encoding UTF8
          }
      - name: Preserve Windows build-product license sources
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $auditVswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $auditInstances = & $auditVswhere -all -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $auditInstances) { throw 'build product unavailable' }
          $auditRecords = @()
          $auditIndex = 0
          foreach ($auditInstance in $auditInstances) {
            $auditRecord = [ordered]@{ product = $auditInstance.productId; version = $auditInstance.installationVersion; displayName = $auditInstance.displayName }
            $auditVersionFile = Join-Path $auditInstance.installationPath 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt'
            if (Test-Path -LiteralPath $auditVersionFile) { $auditRecord.toolsVersion = (Get-Content -LiteralPath $auditVersionFile -Raw).Trim() }
            $auditPackages = Get-ChildItem -LiteralPath "${env:ProgramData}/Microsoft/VisualStudio/Packages" -Directory -Filter "$($auditInstance.productId),version=*"
            foreach ($auditPackage in $auditPackages) {
              $auditManifest = Get-Content -LiteralPath (Join-Path $auditPackage.FullName '_package.json') -Raw | ConvertFrom-Json
              $auditEnglish = $auditManifest.localizedResources | Where-Object { $_.language -ieq 'en-us' } | Select-Object -First 1
              if (-not $auditEnglish.license -or $auditEnglish.license -notmatch '^https://(?:go\.microsoft\.com|visualstudio\.microsoft\.com)/') { throw 'product license source unavailable' }
              $auditIndex++
              $auditFile = "windows-product-license-$auditIndex.html"
              Invoke-WebRequest -UseBasicParsing -Uri $auditEnglish.license -OutFile "dist/audit/$auditFile" -TimeoutSec 60
              $auditRecords += [ordered]@{ product = $auditManifest.id; version = $auditManifest.version; source = $auditEnglish.license; filename = $auditFile; sha256 = (Get-FileHash -LiteralPath "dist/audit/$auditFile" -Algorithm SHA256).Hash.ToLower() }
            }
            $auditRecords += $auditRecord
          }
          if ($auditIndex -eq 0) { throw 'no build product licenses retained' }
          $auditRecords | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath dist/audit/windows-build-products.json -Encoding UTF8
      - name: Exercise real native Unix installation and removal
        if: runner.os != 'Windows'
        shell: bash
        run: sh installers/smoke-install.sh "$PWD/dist" "$AUDIT_VERSION"
      - name: Exercise real native Windows installation and removal
        if: runner.os == 'Windows'
        shell: powershell
        run: '& .\installers\smoke-install.ps1 -ReleaseDirectory "$PWD/dist" -ReleaseVersion $env:AUDIT_VERSION'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-audit-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
